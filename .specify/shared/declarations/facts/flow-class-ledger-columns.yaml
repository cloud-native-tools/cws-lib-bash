# Batch 1, row 7 (contracts/migration-batches.contract.md C-042).
#
# The one machine-read copy of the per-unit ledger's required column set — an ordered operator table,
# because the header check compares the same ordered tuple. `notes` is not a required column: it is
# voluntary in the owner's table. The engine reads it through `.specify/scripts/python/declaration_reader.py`;
# the carrier reaches it by `.specify/shared/declarations/facts/flow-class-ledger-columns.yaml#/statement`.
fact: flow-class-ledger-columns
kind: ordered-operator-table
statement:
  - unit_id
  - flow_class
  - basis
  - neutral
consumers:
  - .specify/scripts/python/flow-class-check.py
former_carriers:
  - .specify/shared/definitions/flow-class-definitions.md
note: "Both faces agreed before migration (REQUIRED_LEDGER_COLUMNS and the carrier's 列头 sentence plus its table header), so the authority order picked the code-side value with nothing to correct."
